const searchInput = document.getElementById('search-input');
const emptyState = document.getElementById('empty-state');
const summary = document.getElementById('summary');
const backButton = document.getElementById('back-button');
const tabsContainer = document.getElementById('tabs');
const categoryFilter = document.getElementById('category-filter');
const periodFilter = document.getElementById('period-filter');
const articleHead = document.getElementById('article-head');
let sortedArticles = [];
let activeArticles = [];
let visibleArticleCount = 0;
let searchDebounceTimer = null;
let priceHistoryChart = null;
const pageSize = 20;
const periodOptions = [7, 30, 90];
const defaultPeriodDays = 7;
const uncategorizedLabel = 'Uncategorized';
const unknownNameLabel = '(name unknown)';

const tabs = [
  { id: 'all', label: 'Latest change, all time' },
  { id: 'drops', label: 'Biggest drops' },
  { id: 'increases', label: 'Biggest increases' },
  { id: 'new', label: 'New articles' },
  { id: 'removed', label: 'Removed articles' }
];
const defaultTabId = 'all';

let activeTabId = defaultTabId;
let activePeriodDays = defaultPeriodDays;
let activeCategory = '';
let allRemovedArticles = [];
let resultTimestamp = '';
let periodStart = '';
let periodClampedToFirstSnapshot = false;
let periodListsKey = '';
let periodSourceArticles = [];
let periodSourceRemoved = [];
let periodChanges = new Map();
let dropArticles = [];
let increaseArticles = [];
let newArticles = [];
let removedInPeriodArticles = [];
let documentId = '';

function parseMoney(value) {
  const parsed = Number.parseFloat(String(value ?? '0').replace(',', '.'));
  return Number.isFinite(parsed) ? parsed : 0;
}

function getSortedArticles(articles) {
  return [...articles].sort((left, right) => {
    const diff = Math.abs(parseMoney(right.latestpricediff)) - Math.abs(parseMoney(left.latestpricediff));
    if (diff !== 0) return diff;
    return String(left.articleid).localeCompare(String(right.articleid), 'sv');
  });
}

function isPeriodTab(tabId) {
  return tabId !== 'all';
}

function isChangeTab(tabId) {
  return tabId === 'drops' || tabId === 'increases';
}

function normalizeTabId(tabId) {
  return tabs.some(tab => tab.id === tabId) ? tabId : defaultTabId;
}

function normalizePeriodDays(value) {
  const parsed = Number.parseInt(String(value ?? ''), 10);
  return periodOptions.includes(parsed) ? parsed : defaultPeriodDays;
}

function displayName(article) {
  return String(article.name ?? '').trim() || unknownNameLabel;
}

function firstHistoryDate(article) {
  const history = Array.isArray(article.pricehistory) ? article.pricehistory : [];
  return history.length > 0 ? String(history[0].date ?? '') : '';
}

function articleCategory(article) {
  return String(article.category ?? '').trim() || uncategorizedLabel;
}

// Timestamps are UTC yyyyMMddHHmm strings, so they compare correctly as strings.
function parseTimestamp(value) {
  const match = /^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})$/.exec(String(value ?? ''));
  if (!match) return null;
  const [, yyyy, MM, dd, HH, mm] = match.map(Number);
  return new Date(Date.UTC(yyyy, MM - 1, dd, HH, mm));
}

function formatTimestamp(date) {
  const pad = value => String(value).padStart(2, '0');
  return `${date.getUTCFullYear()}${pad(date.getUTCMonth() + 1)}${pad(date.getUTCDate())}${pad(date.getUTCHours())}${pad(date.getUTCMinutes())}`;
}

function formatDisplayDate(timestamp) {
  const date = parseTimestamp(timestamp);
  return date ? date.toISOString().slice(0, 10) : String(timestamp ?? '');
}

function subtractDays(timestamp, days) {
  const date = parseTimestamp(timestamp);
  if (!date) return '';
  return formatTimestamp(new Date(date.getTime() - days * 24 * 60 * 60 * 1000));
}

function firstSnapshotTimestamp(articles) {
  let first = '';
  for (const article of articles) {
    const date = firstHistoryDate(article);
    if (date && (!first || date < first)) first = date;
  }

  return first;
}

// Net price change between the price in effect at `since` and the latest price.
// Returns null when the article had no price at `since` (new article) or did not change.
function computePeriodChange(article, since) {
  const history = Array.isArray(article.pricehistory) ? article.pricehistory : [];
  if (history.length === 0 || !since) return null;

  let baseline = null;
  for (const entry of history) {
    if (String(entry.date ?? '') <= since) {
      baseline = entry;
    } else {
      break;
    }
  }

  const latest = history[history.length - 1];
  if (!baseline || baseline === latest) return null;

  const fromPrice = parseMoney(baseline.price);
  const toPrice = parseMoney(latest.price);
  const change = Math.round((toPrice - fromPrice) * 100) / 100;
  if (change === 0) return null;

  return {
    change,
    percent: fromPrice !== 0 ? (change / fromPrice) * 100 : null,
    fromPrice,
    toPrice
  };
}

function compareByChange(direction) {
  return (left, right) => {
    const a = periodChanges.get(left.articleid);
    const b = periodChanges.get(right.articleid);
    const diff = direction * (a.change - b.change);
    if (diff !== 0) return diff;
    const percentDiff = direction * ((a.percent ?? 0) - (b.percent ?? 0));
    if (percentDiff !== 0) return percentDiff;
    return String(left.articleid).localeCompare(String(right.articleid), 'sv');
  };
}

function compareText(left, right) {
  return String(left ?? '').localeCompare(String(right ?? ''), 'sv');
}

// Builds the drops/increases/new/removed lists for one period. The period ends at the result
// timestamp (when the data was built), not the browser clock, and starts `days` before it, or at
// the first snapshot when tracking started more recently than that.
function buildPeriodLists(articles, removed, timestamp, days) {
  periodSourceArticles = articles;
  periodSourceRemoved = Array.isArray(removed) ? removed : [];
  resultTimestamp = String(timestamp ?? '');
  periodListsKey = `${resultTimestamp}|${days}`;
  const firstSnapshot = firstSnapshotTimestamp([...articles, ...periodSourceRemoved]);
  periodStart = subtractDays(resultTimestamp, days);
  periodClampedToFirstSnapshot = Boolean(firstSnapshot && periodStart && periodStart < firstSnapshot);
  if (periodClampedToFirstSnapshot) {
    periodStart = firstSnapshot;
  }

  periodChanges = new Map();
  for (const article of articles) {
    const change = computePeriodChange(article, periodStart);
    if (change) periodChanges.set(article.articleid, change);
  }

  const changed = articles.filter(article => periodChanges.has(article.articleid));
  dropArticles = changed.filter(article => periodChanges.get(article.articleid).change < 0).sort(compareByChange(1));
  increaseArticles = changed.filter(article => periodChanges.get(article.articleid).change > 0).sort(compareByChange(-1));

  // New: first seen after the period start. Newest first.
  newArticles = articles
    .filter(article => firstHistoryDate(article) > periodStart)
    .sort((left, right) => compareText(firstHistoryDate(right), firstHistoryDate(left))
      || compareText(left.name, right.name));

  // Removed: missing from the feed since a snapshot after the period start. Most recent first.
  removedInPeriodArticles = periodSourceRemoved
    .filter(article => String(article.removedat ?? '') > periodStart)
    .sort((left, right) => compareText(right.removedat, left.removedat)
      || compareText(left.articleid, right.articleid));
}

function ensurePeriodLists() {
  if (periodListsKey !== `${resultTimestamp}|${activePeriodDays}`) {
    buildPeriodLists(periodSourceArticles, periodSourceRemoved, resultTimestamp, activePeriodDays);
  }
}

function getTabArticles(tabId) {
  if (tabId === 'drops') return dropArticles;
  if (tabId === 'increases') return increaseArticles;
  if (tabId === 'new') return newArticles;
  if (tabId === 'removed') return removedInPeriodArticles;
  return sortedArticles;
}

function filterByCategory(articles, category) {
  if (!category) return articles;
  return articles.filter(article => articleCategory(article) === category);
}

function formatSignedMoney(value) {
  const fixed = Math.abs(value).toFixed(2);
  if (value > 0) return `+${fixed}`;
  if (value < 0) return `-${fixed}`;
  return fixed;
}

function formatPercent(value) {
  if (value === null || value === undefined || !Number.isFinite(value)) return '';
  const rounded = Math.round(value * 10) / 10;
  return `${rounded > 0 ? '+' : ''}${rounded.toFixed(1)}%`;
}

function filterArticles(articles, query) {
  const normalized = query.trim().toLocaleLowerCase('sv');
  if (!normalized) return articles;

  return articles.filter(article => {
    return String(article.articleid).toLocaleLowerCase('sv').includes(normalized)
      || String(article.name).toLocaleLowerCase('sv').includes(normalized);
  });
}

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function diffClass(value) {
  const parsed = parseMoney(value);
  if (parsed > 0) return 'diff-positive';
  if (parsed < 0) return 'diff-negative';
  return 'diff-neutral';
}

function latestHistory(article) {
  const history = Array.isArray(article.pricehistory) ? article.pricehistory : [];
  return history.length > 0 ? history[history.length - 1] : null;
}

function articleImageSrc(articleId) {
  return `https://productimages.biltema.com/v1/Image/article/small/${encodeURIComponent(String(articleId ?? ''))}/1`;
}

function articlePageHref(articleId) {
  return `https://www.biltema.se/redirect/article/1/sv/${encodeURIComponent(String(articleId ?? ''))}`;
}

function articleRouteHref(articleId) {
  return `#/article/${encodeURIComponent(String(articleId ?? ''))}`;
}

function searchRouteHref(searchTerm, tabId = activeTabId, category = activeCategory, periodDays = activePeriodDays) {
  const params = [];
  if (tabId && tabId !== defaultTabId) params.push(`tab=${encodeURIComponent(tabId)}`);
  if (periodDays && periodDays !== defaultPeriodDays) params.push(`period=${encodeURIComponent(periodDays)}`);
  if (category) params.push(`category=${encodeURIComponent(category)}`);
  const trimmed = String(searchTerm ?? '').trim();
  if (trimmed) params.push(`searchTerm=${encodeURIComponent(trimmed)}`);
  return params.length > 0 ? `#/search?${params.join('&')}` : '#/search';
}

function parseRoute() {
  const hash = window.location.hash.startsWith('#')
    ? window.location.hash.slice(1)
    : window.location.hash;
  const [pathPart, queryPart = ''] = hash.split('?');
  const path = pathPart || '/search';
  const query = new URLSearchParams(queryPart);

  if (path.startsWith('/article/')) {
    return {
      name: 'article',
      articleId: decodeURIComponent(path.slice('/article/'.length))
    };
  }

  return {
    name: 'search',
    searchTerm: query.get('searchTerm') ?? '',
    tabId: normalizeTabId(query.get('tab') ?? defaultTabId),
    periodDays: normalizePeriodDays(query.get('period')),
    category: query.get('category') ?? ''
  };
}

function setHash(hash) {
  if (window.location.hash !== hash) {
    window.location.hash = hash;
  }
}

function renderTableHead() {
  const columnsByTab = {
    drops: ['Article', 'Name', `Change ${activePeriodDays}d`, 'Change %', 'Price now', 'Price before'],
    increases: ['Article', 'Name', `Change ${activePeriodDays}d`, 'Change %', 'Price now', 'Price before'],
    new: ['Article', 'Name', 'Added', 'Price', 'History'],
    removed: ['Article', 'Name', 'Removed', 'Last price', 'History'],
    all: ['Article', 'Name', 'Latest diff', 'Latest price', 'History']
  };
  const columns = columnsByTab[activeTabId] ?? columnsByTab.all;
  articleHead.innerHTML = `<tr>${columns.map(column => `<th>${escapeHtml(column)}</th>`).join('')}</tr>`;
}

function renderTabs() {
  tabsContainer.innerHTML = tabs.map(tab => `
    <button type="button" class="tab${tab.id === activeTabId ? ' tab-active' : ''}" data-tab="${escapeHtml(tab.id)}" aria-pressed="${tab.id === activeTabId}">${escapeHtml(tab.label)}</button>
  `).join('');
}

function renderPeriodFilter() {
  if (!isPeriodTab(activeTabId)) {
    periodFilter.innerHTML = '';
    return;
  }

  periodFilter.innerHTML = '<span class="period-label">Period</span>' + periodOptions.map(days => `
    <button type="button" class="period${days === activePeriodDays ? ' period-active' : ''}" data-period="${days}" aria-pressed="${days === activePeriodDays}">${days} days</button>
  `).join('');
}

function renderCategoryFilter(tabArticles) {
  const counts = new Map();
  for (const article of tabArticles) {
    const category = articleCategory(article);
    counts.set(category, (counts.get(category) ?? 0) + 1);
  }

  const categories = [...counts.entries()].sort((left, right) => {
    if (left[0] === uncategorizedLabel) return 1;
    if (right[0] === uncategorizedLabel) return -1;
    return right[1] - left[1] || left[0].localeCompare(right[0], 'sv');
  });

  if (activeCategory && !counts.has(activeCategory)) {
    categories.push([activeCategory, 0]);
  }

  const chip = (category, label, count) => `
    <button type="button" class="chip${category === activeCategory ? ' chip-active' : ''}" data-category="${escapeHtml(category)}" aria-pressed="${category === activeCategory}">${escapeHtml(label)} <span class="chip-count">${count}</span></button>
  `;

  categoryFilter.innerHTML = chip('', 'All categories', tabArticles.length)
    + categories.map(([category, count]) => chip(category, category, count)).join('');
}

function renderNameCell(article) {
  const replacedBy = article.replacedby
    ? `<span class="replaced-by">Replaced by <a class="replaced-link" href="${escapeHtml(articleRouteHref(article.replacedby))}">${escapeHtml(article.replacedby)}</a></span>`
    : '';
  return `<td class="name-cell">${escapeHtml(displayName(article))}<span class="category-label">${escapeHtml(articleCategory(article))}</span>${replacedBy}</td>`;
}

function renderArticleRows(articles, append = false) {
  const rows = articles.map(article => {
    const latest = latestHistory(article);
    const change = periodChanges.get(article.articleid);
    const historyCount = Array.isArray(article.pricehistory) ? article.pricehistory.length : 0;
    let valueCells;
    if (isChangeTab(activeTabId) && change) {
      valueCells = `
        <td class="money ${diffClass(change.change)}">${escapeHtml(formatSignedMoney(change.change))}</td>
        <td class="money ${diffClass(change.change)}">${escapeHtml(formatPercent(change.percent))}</td>
        <td class="money">${escapeHtml(change.toPrice.toFixed(2))}</td>
        <td class="money muted">${escapeHtml(change.fromPrice.toFixed(2))}</td>`;
    } else if (activeTabId === 'new' || activeTabId === 'removed') {
      const date = activeTabId === 'new' ? firstHistoryDate(article) : article.removedat;
      valueCells = `
        <td class="date">${escapeHtml(formatDisplayDate(date))}</td>
        <td class="money">${escapeHtml(latest ? latest.price : '')}</td>
        <td>${historyCount}</td>`;
    } else {
      valueCells = `
        <td class="money ${diffClass(article.latestpricediff)}">${escapeHtml(article.latestpricediff)}</td>
        <td class="money">${escapeHtml(latest ? latest.price : '')}</td>
        <td>${historyCount}</td>`;
    }

    return `
      <tr data-article-id="${escapeHtml(article.articleid)}">
        <td class="article-cell">
          <img class="article-thumb" src="${escapeHtml(articleImageSrc(article.articleid))}" alt="" loading="lazy">
          <span class="article-id">${escapeHtml(article.articleid)}</span>
        </td>
        ${renderNameCell(article)}${valueCells}
      </tr>
    `;
  }).join('');

  if (append) {
    articleList.insertAdjacentHTML('beforeend', rows);
  } else {
    articleList.innerHTML = rows;
  }

  articleList.querySelectorAll('tr:not([data-bound])').forEach(row => {
    row.dataset.bound = 'true';
    row.addEventListener('click', () => {
      setHash(articleRouteHref(row.dataset.articleId));
    });
  });

  articleList.querySelectorAll('a:not([data-bound])').forEach(link => {
    link.dataset.bound = 'true';
    link.addEventListener('click', event => event.stopPropagation());
  });

  emptyState.hidden = activeArticles.length !== 0;
  if (activeArticles.length === 0) {
    const emptyTexts = {
      drops: 'No price drops',
      increases: 'No price increases',
      new: 'No new articles',
      removed: 'No removed articles'
    };
    emptyState.textContent = isPeriodTab(activeTabId) && !searchInput.value.trim()
      ? `${emptyTexts[activeTabId]} in this period${activeCategory ? ` in ${activeCategory}` : ''}.`
      : 'No matching articles.';
  }
}

function renderHistoryRows(article) {
  const history = Array.isArray(article.pricehistory) ? article.pricehistory : [];
  return history.map(entry => `
    <div class="history-row">
      <span>${escapeHtml(entry.date)}</span>
      <span class="money">${escapeHtml(entry.price)}</span>
      <span class="money ${diffClass(entry.priceDiff)}">${escapeHtml(entry.priceDiff)}</span>
    </div>
  `).join('');
}

function destroyPriceHistoryChart() {
  if (priceHistoryChart) {
    priceHistoryChart.destroy();
    priceHistoryChart = null;
  }
}

function renderPriceHistoryChart(article) {
  destroyPriceHistoryChart();

  const canvas = document.getElementById('price-history-chart');
  if (!canvas || typeof Chart === 'undefined') {
    return;
  }

  const history = Array.isArray(article.pricehistory) ? article.pricehistory : [];
  const labels = history.map(entry => String(entry.date ?? ''));
  const prices = history.map(entry => parseMoney(entry.price));

  priceHistoryChart = new Chart(canvas, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Price',
        data: prices,
        fill: false,
        borderColor: '#0071b9',
        backgroundColor: '#0071b9',
        borderWidth: 2,
        pointRadius: 3,
        pointHoverRadius: 5,
        tension: 0.1
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          display: false
        },
        tooltip: {
          callbacks: {
            label: context => `Price ${context.parsed.y.toFixed(2)}`
          }
        }
      },
      scales: {
        x: {
          ticks: {
            maxRotation: 0,
            autoSkip: true
          }
        },
        y: {
          beginAtZero: false
        }
      }
    }
  });
}

function renderDetailPeriodChange(article) {
  const change = periodChanges.get(article.articleid);
  if (!change) return '';
  return `<div class="money ${diffClass(change.change)}">${activePeriodDays}-day change ${escapeHtml(formatSignedMoney(change.change))} (${escapeHtml(formatPercent(change.percent))})</div>`;
}

function showDetail(article) {
  const latest = latestHistory(article);
  articleDetail.innerHTML = `
    <div class="detail-header">
      <div class="detail-title">
        <img class="detail-image" src="${escapeHtml(articleImageSrc(article.articleid))}" alt="" loading="lazy">
        <div>
          <div class="article-id">${escapeHtml(article.articleid)}</div>
          <h2><a href="${escapeHtml(articlePageHref(article.articleid))}" target="_blank" rel="noopener noreferrer">${escapeHtml(displayName(article))}</a></h2>
          <div class="detail-meta">${escapeHtml(articleCategory(article))}</div>
          ${article.removedat ? `<div class="detail-meta removed-note">Removed from the Biltema feed ${escapeHtml(formatDisplayDate(article.removedat))}</div>` : ''}
          <div class="detail-meta">${article.replacedby ? `Replaced by <a class="replaced-link" href="${escapeHtml(articleRouteHref(article.replacedby))}">${escapeHtml(article.replacedby)}</a>` : 'Not replaced'}</div>
        </div>
      </div>
      <div>
        <div class="money ${diffClass(article.latestpricediff)}">Latest diff ${escapeHtml(article.latestpricediff)}</div>
        <div class="money">${article.removedat ? 'Last price' : 'Latest price'} ${escapeHtml(latest ? latest.price : '')}</div>
        ${renderDetailPeriodChange(article)}
      </div>
    </div>
    <div class="chart-panel">
      <canvas id="price-history-chart"></canvas>
    </div>
    <div class="history">${renderHistoryRows(article)}</div>
  `;

  renderPriceHistoryChart(article);
  listView.hidden = true;
  detailView.hidden = false;
}

function showList() {
  destroyPriceHistoryChart();
  detailView.hidden = true;
  listView.hidden = false;
}

function navigateToSearch() {
  setHash(searchRouteHref(searchInput.value));
}

function renderVisibleArticles(append = false) {
  const nextArticles = activeArticles.slice(append ? visibleArticleCount : 0, visibleArticleCount);
  renderArticleRows(nextArticles, append);
}

function describeActiveList() {
  if (!isPeriodTab(activeTabId)) {
    return 'Sorted by absolute latest price diff.';
  }

  const period = periodClampedToFirstSnapshot
    ? `since tracking started ${formatDisplayDate(periodStart)}`
    : `in the last ${activePeriodDays} days (${formatDisplayDate(periodStart)} to ${formatDisplayDate(resultTimestamp)})`;
  const descriptions = {
    drops: `Largest price drops ${period}, in kronor.`,
    increases: `Largest price increases ${period}, in kronor.`,
    new: `Articles added to the Biltema feed ${period}, newest first.`,
    removed: `Articles that disappeared from the Biltema feed ${period}, most recent first.`
  };
  return descriptions[activeTabId];
}

function updateSummary() {
  const tabArticles = getTabArticles(activeTabId);
  const shown = filterByCategory(tabArticles, activeCategory).length;
  const categoryText = activeCategory ? ` in ${activeCategory}` : '';
  summary.textContent = `${shown} articles${categoryText}. DocumentId ${documentId}. ${describeActiveList()}`;
}

function resetList() {
  ensurePeriodLists();
  const tabArticles = getTabArticles(activeTabId);
  renderTabs();
  renderPeriodFilter();
  renderCategoryFilter(tabArticles);
  renderTableHead();
  updateSummary();
  activeArticles = filterArticles(filterByCategory(tabArticles, activeCategory), searchInput.value);
  visibleArticleCount = Math.min(pageSize, activeArticles.length);
  renderVisibleArticles(false);
}

function loadMoreArticles() {
  if (visibleArticleCount >= activeArticles.length) {
    return;
  }

  const previousCount = visibleArticleCount;
  visibleArticleCount = Math.min(visibleArticleCount + pageSize, activeArticles.length);
  renderArticleRows(activeArticles.slice(previousCount, visibleArticleCount), true);
}

function maybeLoadMoreArticles() {
  if (detailView.hidden === false || activeArticles.length === 0) {
    return;
  }

  const remainingScroll = document.documentElement.scrollHeight - window.innerHeight - window.scrollY;
  if (remainingScroll < 420) {
    loadMoreArticles();
  }
}

function updateListDebounced() {
  clearTimeout(searchDebounceTimer);
  searchDebounceTimer = setTimeout(() => {
    resetList();
    navigateToSearch();
  }, 300);
}

function findArticle(articleId) {
  return sortedArticles.find(item => String(item.articleid) === articleId)
    ?? allRemovedArticles.find(item => String(item.articleid) === articleId);
}

function handleRoute() {
  const route = parseRoute();

  if (route.name === 'article') {
    const article = findArticle(route.articleId);
    if (article) {
      showDetail(article);
      return;
    }
  }

  searchInput.value = route.searchTerm ?? '';
  activeTabId = route.tabId ?? defaultTabId;
  activePeriodDays = route.periodDays ?? defaultPeriodDays;
  activeCategory = route.category ?? '';
  showList();
  resetList();
}

const articlesCacheTimestampKey = 'articlescachekey';
const articlesCacheDataKey = 'articles';

function readCachedResult(versionHash) {
  try {
    const cachedVersionHash = localStorage.getItem(articlesCacheTimestampKey);
    if (cachedVersionHash !== versionHash) {
      return null;
    }

    const cached = localStorage.getItem(articlesCacheDataKey);
    if (!cached) {
      return null;
    }

    const resultData = JSON.parse(cached);
    return resultData && resultData.timestamp ? resultData : null;
  } catch {
    return null;
  }
}

function writeCachedResult(versionHash, resultData) {
  try {
    localStorage.setItem(articlesCacheTimestampKey, versionHash);
    localStorage.setItem(articlesCacheDataKey, JSON.stringify(resultData));
  } catch {
    // Rendering should still work if localStorage is blocked or full.
  }
}

function base64ToBytes(value) {
  const binary = atob(value);
  const bytes = new Uint8Array(binary.length);
  for (let index = 0; index < binary.length; index++) {
    bytes[index] = binary.charCodeAt(index);
  }

  return bytes;
}

async function decompressResultData(data) {
  if (data.encoding !== 'gzip-base64') {
    throw new Error(`Unsupported result data encoding: ${data.encoding}`);
  }

  const stream = new Blob([base64ToBytes(data.payload)])
    .stream()
    .pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(stream).text());
}

async function loadResultData(versionHash, data) {
  const cached = readCachedResult(versionHash);
  if (cached) {
    return cached;
  }

  if (data.timestamp !== versionHash) {
    throw new Error('Compressed result data version does not match page version.');
  }

  const resultData = await decompressResultData(data);
  writeCachedResult(versionHash, resultData);
  return resultData;
}

function renderApp(resultData) {
  sortedArticles = getSortedArticles(Array.isArray(resultData.articles) ? resultData.articles : []);
  allRemovedArticles = Array.isArray(resultData.removedarticles) ? resultData.removedarticles : [];
  buildPeriodLists(sortedArticles, allRemovedArticles, resultData.timestamp, activePeriodDays);
  documentId = generateId();
  handleRoute();
}

function generateId() {
    const now = new Date();

    const yyyy = now.getFullYear();
    const MM = String(now.getMonth() + 1).padStart(2, "0");
    const dd = String(now.getDate()).padStart(2, "0");
    const HH = String(now.getHours()).padStart(2, "0");

    const randomLetters = Array.from(
        { length: 4 },
        () => String.fromCharCode(65 + Math.floor(Math.random() * 26))
    ).join("");

    return `${yyyy}${MM}${dd}${HH}${randomLetters}`;
}

searchInput.addEventListener('input', updateListDebounced);
window.addEventListener('scroll', maybeLoadMoreArticles, { passive: true });
window.addEventListener('hashchange', handleRoute);
backButton.addEventListener('click', navigateToSearch);
tabsContainer.addEventListener('click', event => {
  const button = event.target.closest('button[data-tab]');
  if (!button) return;
  activeTabId = normalizeTabId(button.dataset.tab);
  navigateToSearch();
});
periodFilter.addEventListener('click', event => {
  const button = event.target.closest('button[data-period]');
  if (!button) return;
  activePeriodDays = normalizePeriodDays(button.dataset.period);
  navigateToSearch();
});
categoryFilter.addEventListener('click', event => {
  const button = event.target.closest('button[data-category]');
  if (!button) return;
  activeCategory = button.dataset.category ?? '';
  navigateToSearch();
});
window.addEventListener('keydown', event => {
  if (event.key === 'Escape' && !detailView.hidden) {
    navigateToSearch();
  }
});

const appReady = loadResultData(resultDataTimestamp, compressedResultData)
  .then(renderApp)
  .catch(error => {
    console.error(error);
    summary.textContent = 'Could not load price data.';
  });

  </script>
