    /* chartjs:end */
    const articleList = document.getElementById('article-list');
const articleDetail = document.getElementById('article-detail');
const listView = document.getElementById('list-view');
const detailView = document.getElementById('detail-view');
const searchInput = document.getElementById('search-input');
const emptyState = document.getElementById('empty-state');
const summary = document.getElementById('summary');
const backButton = document.getElementById('back-button');
let sortedArticles = [];
let activeArticles = [];
let visibleArticleCount = 0;
let searchDebounceTimer = null;
let priceHistoryChart = null;
const pageSize = 20;

function parseMoney(value) {
  const parsed = Number.parseFloat(String(value ?? '0').replace(',', '.'));
  return Number.isFinite(parsed) ? parsed : 0;
}

function getSortedArticles(articles) {
  return [...articles].sort((left, right) => {
    const diff = Math.abs(parseMoney(right.latestpricediff)) - Math.abs(parseMoney(left.latestpricediff));
    if (diff !== 0) return diff;
    return String(left.articleid).localeCompare(String(right.articleid), 'sv');
  });
}

function filterArticles(articles, query) {
  const normalized = query.trim().toLocaleLowerCase('sv');
  if (!normalized) return articles;

  return articles.filter(article => {
    return String(article.articleid).toLocaleLowerCase('sv').includes(normalized)
      || String(article.name).toLocaleLowerCase('sv').includes(normalized);
  });
}

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function diffClass(value) {
  const parsed = parseMoney(value);
  if (parsed > 0) return 'diff-positive';
  if (parsed < 0) return 'diff-negative';
  return 'diff-neutral';
}

function latestHistory(article) {
  const history = Array.isArray(article.pricehistory) ? article.pricehistory : [];
  return history.length > 0 ? history[history.length - 1] : null;
}

function articleImageSrc(articleId) {
  return `https://productimages.biltema.com/v1/Image/article/small/${encodeURIComponent(String(articleId ?? ''))}/1`;
}

function articlePageHref(articleId) {
  return `https://www.biltema.se/redirect/article/1/sv/${encodeURIComponent(String(articleId ?? ''))}`;
}

function articleRouteHref(articleId) {
  return `#/article/${encodeURIComponent(String(articleId ?? ''))}`;
}

function searchRouteHref(searchTerm) {
  const trimmed = String(searchTerm ?? '').trim();
  return trimmed ? `#/search?searchTerm=${encodeURIComponent(trimmed)}` : '#/search';
}

function parseRoute() {
  const hash = window.location.hash.startsWith('#')
    ? window.location.hash.slice(1)
    : window.location.hash;
  const [pathPart, queryPart = ''] = hash.split('?');
  const path = pathPart || '/search';
  const query = new URLSearchParams(queryPart);

  if (path.startsWith('/article/')) {
    return {
      name: 'article',
      articleId: decodeURIComponent(path.slice('/article/'.length))
    };
  }

  return {
    name: 'search',
    searchTerm: query.get('searchTerm') ?? ''
  };
}

function setHash(hash) {
  if (window.location.hash !== hash) {
    window.location.hash = hash;
  }
}

function renderArticleRows(articles, append = false) {
  const rows = articles.map(article => {
    const latest = latestHistory(article);
    const replacedBy = article.replacedby
      ? `<span class="replaced-by">Replaced by <a class="replaced-link" href="${escapeHtml(articleRouteHref(article.replacedby))}">${escapeHtml(article.replacedby)}</a></span>`
      : '';

    return `
      <tr data-article-id="${escapeHtml(article.articleid)}">
        <td class="article-cell">
          <img class="article-thumb" src="${escapeHtml(articleImageSrc(article.articleid))}" alt="" loading="lazy">
          <span class="article-id">${escapeHtml(article.articleid)}</span>
        </td>
        <td class="name-cell">${escapeHtml(article.name)}${replacedBy}</td>
        <td class="money ${diffClass(article.latestpricediff)}">${escapeHtml(article.latestpricediff)}</td>
        <td class="money">${escapeHtml(latest ? latest.price : '')}</td>
        <td>${Array.isArray(article.pricehistory) ? article.pricehistory.length : 0}</td>
      </tr>
    `;
  }).join('');

  if (append) {
    articleList.insertAdjacentHTML('beforeend', rows);
  } else {
    articleList.innerHTML = rows;
  }

  articleList.querySelectorAll('tr:not([data-bound])').forEach(row => {
    row.dataset.bound = 'true';
    row.addEventListener('click', () => {
      setHash(articleRouteHref(row.dataset.articleId));
    });
  });

  articleList.querySelectorAll('a:not([data-bound])').forEach(link => {
    link.dataset.bound = 'true';
    link.addEventListener('click', event => event.stopPropagation());
  });

  emptyState.hidden = activeArticles.length !== 0;
}

function renderHistoryRows(article) {
  const history = Array.isArray(article.pricehistory) ? article.pricehistory : [];
  return history.map(entry => `
    <div class="history-row">
      <span>${escapeHtml(entry.date)}</span>
      <span class="money">${escapeHtml(entry.price)}</span>
      <span class="money ${diffClass(entry.priceDiff)}">${escapeHtml(entry.priceDiff)}</span>
    </div>
  `).join('');
}

function destroyPriceHistoryChart() {
  if (priceHistoryChart) {
    priceHistoryChart.destroy();
    priceHistoryChart = null;
  }
}

function renderPriceHistoryChart(article) {
  destroyPriceHistoryChart();

  const canvas = document.getElementById('price-history-chart');
  if (!canvas || typeof Chart === 'undefined') {
    return;
  }

  const history = Array.isArray(article.pricehistory) ? article.pricehistory : [];
  const labels = history.map(entry => String(entry.date ?? ''));
  const prices = history.map(entry => parseMoney(entry.price));

  priceHistoryChart = new Chart(canvas, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Price',
        data: prices,
        fill: false,
        borderColor: '#0071b9',
        backgroundColor: '#0071b9',
        borderWidth: 2,
        pointRadius: 3,
        pointHoverRadius: 5,
        tension: 0.1
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          display: false
        },
        tooltip: {
          callbacks: {
            label: context => `Price ${context.parsed.y.toFixed(2)}`
          }
        }
      },
      scales: {
        x: {
          ticks: {
            maxRotation: 0,
            autoSkip: true
          }
        },
        y: {
          beginAtZero: false
        }
      }
    }
  });
}

function showDetail(article) {
  const latest = latestHistory(article);
  articleDetail.innerHTML = `
    <div class="detail-header">
      <div class="detail-title">
        <img class="detail-image" src="${escapeHtml(articleImageSrc(article.articleid))}" alt="" loading="lazy">
        <div>
          <div class="article-id">${escapeHtml(article.articleid)}</div>
          <h2><a href="${escapeHtml(articlePageHref(article.articleid))}" target="_blank" rel="noopener noreferrer">${escapeHtml(article.name)}</a></h2>
          <div class="detail-meta">${article.replacedby ? `Replaced by <a class="replaced-link" href="${escapeHtml(articleRouteHref(article.replacedby))}">${escapeHtml(article.replacedby)}</a>` : 'Not replaced'}</div>
        </div>
      </div>
      <div>
        <div class="money ${diffClass(article.latestpricediff)}">Latest diff ${escapeHtml(article.latestpricediff)}</div>
        <div class="money">Latest price ${escapeHtml(latest ? latest.price : '')}</div>
      </div>
    </div>
    <div class="chart-panel">
      <canvas id="price-history-chart"></canvas>
    </div>
    <div class="history">${renderHistoryRows(article)}</div>
  `;

  renderPriceHistoryChart(article);
  listView.hidden = true;
  detailView.hidden = false;
}

function showList() {
  destroyPriceHistoryChart();
  detailView.hidden = true;
  listView.hidden = false;
}

function navigateToSearch() {
  setHash(searchRouteHref(searchInput.value));
}

function renderVisibleArticles(append = false) {
  const nextArticles = activeArticles.slice(append ? visibleArticleCount : 0, visibleArticleCount);
  renderArticleRows(nextArticles, append);
}

function resetList() {
  activeArticles = filterArticles(sortedArticles, searchInput.value);
  visibleArticleCount = Math.min(pageSize, activeArticles.length);
  renderVisibleArticles(false);
}

function loadMoreArticles() {
  if (visibleArticleCount >= activeArticles.length) {
    return;
  }

  const previousCount = visibleArticleCount;
  visibleArticleCount = Math.min(visibleArticleCount + pageSize, activeArticles.length);
  renderArticleRows(activeArticles.slice(previousCount, visibleArticleCount), true);
}

function maybeLoadMoreArticles() {
  if (detailView.hidden === false || activeArticles.length === 0) {
    return;
  }

  const remainingScroll = document.documentElement.scrollHeight - window.innerHeight - window.scrollY;
  if (remainingScroll < 420) {
    loadMoreArticles();
  }
}

function updateListDebounced() {
  clearTimeout(searchDebounceTimer);
  searchDebounceTimer = setTimeout(() => {
    resetList();
    navigateToSearch();
  }, 300);
}

function handleRoute() {
  const route = parseRoute();

  if (route.name === 'article') {
    const article = sortedArticles.find(item => String(item.articleid) === route.articleId);
    if (article) {
      showDetail(article);
      return;
    }
  }

  searchInput.value = route.searchTerm ?? '';
  showList();
  resetList();
}

const articlesCacheTimestampKey = 'articlescachekey';
const articlesCacheDataKey = 'articles';

function readCachedResult(versionHash) {
  try {
    const cachedVersionHash = localStorage.getItem(articlesCacheTimestampKey);
    if (cachedVersionHash !== versionHash) {
      return null;
    }

    const cached = localStorage.getItem(articlesCacheDataKey);
    if (!cached) {
      return null;
    }

    const resultData = JSON.parse(cached);
    return resultData && resultData.timestamp ? resultData : null;
  } catch {
    return null;
  }
}

function writeCachedResult(versionHash, resultData) {
  try {
    localStorage.setItem(articlesCacheTimestampKey, versionHash);
    localStorage.setItem(articlesCacheDataKey, JSON.stringify(resultData));
  } catch {
    // Rendering should still work if localStorage is blocked or full.
  }
}

function base64ToBytes(value) {
  const binary = atob(value);
  const bytes = new Uint8Array(binary.length);
  for (let index = 0; index < binary.length; index++) {
    bytes[index] = binary.charCodeAt(index);
  }

  return bytes;
}

async function decompressResultData(data) {
  if (data.encoding !== 'gzip-base64') {
    throw new Error(`Unsupported result data encoding: ${data.encoding}`);
  }

  const stream = new Blob([base64ToBytes(data.payload)])
    .stream()
    .pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(stream).text());
}

async function loadResultData(versionHash, data) {
  const cached = readCachedResult(versionHash);
  if (cached) {
    return cached;
  }

  if (data.timestamp !== versionHash) {
    throw new Error('Compressed result data version does not match page version.');
  }

  const resultData = await decompressResultData(data);
  writeCachedResult(versionHash, resultData);
  return resultData;
}

function renderApp(resultData) {
  sortedArticles = getSortedArticles(Array.isArray(resultData.articles) ? resultData.articles : []);
  summary.textContent = `${sortedArticles.length} articles. DocumentId ${generateId()}. Sorted by absolute latest price diff.`;
  handleRoute();
}

function generateId() {
    const now = new Date();

    const yyyy = now.getFullYear();
    const MM = String(now.getMonth() + 1).padStart(2, "0");
    const dd = String(now.getDate()).padStart(2, "0");
    const HH = String(now.getHours()).padStart(2, "0");

    const randomLetters = Array.from(
        { length: 4 },
        () => String.fromCharCode(65 + Math.floor(Math.random() * 26))
    ).join("");

    return `${yyyy}${MM}${dd}${HH}${randomLetters}`;
}

searchInput.addEventListener('input', updateListDebounced);
window.addEventListener('scroll', maybeLoadMoreArticles, { passive: true });
window.addEventListener('hashchange', handleRoute);
backButton.addEventListener('click', navigateToSearch);
window.addEventListener('keydown', event => {
  if (event.key === 'Escape' && !detailView.hidden) {
    navigateToSearch();
  }
});

const appReady = loadResultData(resultDataTimestamp, compressedResultData)
  .then(renderApp)
  .catch(error => {
    console.error(error);
    summary.textContent = 'Could not load price data.';
  });

  </script>
</body>
